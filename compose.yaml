name: patientcapital

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-patientcapital}
      POSTGRES_USER: ${POSTGRES_USER:-patientcapital}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-patientcapital}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - patientcapital-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  patientcapital-postgres:
