name: patientcapital

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-patientcapital}
      POSTGRES_USER: ${POSTGRES_USER:-patientcapital}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-patientcapital}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - patientcapital-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      APP_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 8000
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-patientcapital}:${POSTGRES_PASSWORD:-patientcapital}@db:5432/${POSTGRES_DB:-patientcapital}
      CORS_ORIGINS: http://localhost:${WEB_PORT:-3000},http://127.0.0.1:${WEB_PORT:-3000}
      MOEX_ISS_BASE_URL: https://iss.moex.com/iss
      MOEX_TIMEOUT_SECONDS: ${MOEX_TIMEOUT_SECONDS:-10}
      MOEX_MAX_AGE_SECONDS: ${MOEX_MAX_AGE_SECONDS:-345600}
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-8388608}
      UPLOAD_MAX_PIXELS: ${UPLOAD_MAX_PIXELS:-20000000}
      OCR_TIMEOUT_SECONDS: ${OCR_TIMEOUT_SECONDS:-20}
      UPLOAD_TEMP_DIRECTORY: /tmp
      GIGACHAT_ENABLED: "false"
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    init: true
    read_only: true
    tmpfs:
      - /tmp

  web:
    build:
      context: web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:${API_PORT:-8000}
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      WRANGLER_WRITE_LOGS: "false"
      WRANGLER_LOG_PATH: /tmp/wrangler.log
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    init: true
    read_only: true
    tmpfs:
      - /tmp

volumes:
  patientcapital-postgres:
